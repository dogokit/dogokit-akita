# Local development. Run: docker compose up -d
services:
  postgres:
    image: postgres:19-alpine
    restart: no
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    env_file:
      - path: .env
        required: true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
