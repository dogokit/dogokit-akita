# Ephemeral integration tests. Adds to docker-compose.yml.
# Up:   bun run infra:test:up
# Port: bun run infra:test:port
# Down: bun run infra:test:down
# Set COMPOSE_PROJECT_NAME to a unique value to run several stacks at once, such as in CI
# Project name: uses COMPOSE_PROJECT_NAME if set and not empty, else example-project
# The :- means an empty value also falls back to the default
name: ${COMPOSE_PROJECT_NAME:-example-project}

services:
  postgres:
    # Data lives in memory and is gone after `down`
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql
    # Random free host port, so it never clashes with the dev database
    ports: !override
      - "127.0.0.1::5432"
    # Fixed test values, so tests do not need a .env file
    env_file: !reset []
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
