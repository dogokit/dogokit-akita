# Shared dev, staging and production
# Values come from the shell first, then from --env-file. See docs/guides/environments.md
# ${VAR:?} stops Compose with an error when VAR is unset or empty
services:
  postgres:
    image: postgres:19-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - ${POSTGRES_HOST_PORT:?}:${POSTGRES_CONTAINER_PORT:?}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
  api:
    image: example-api:latest
    build:
      context: .
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: ${DATABASE_URL:?}

volumes:
  postgres_data:
