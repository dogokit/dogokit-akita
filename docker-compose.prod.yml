services:
  postgres:
    image: postgres:19-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - ${POSTGRES_HOST_PORT}:${POSTGRES_CONTAINER_PORT}
    env_file:
      - path: .env
        required: true
  api:
    image: example-api:latest
    build:
      context: .
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    env_file:
      - path: .env
        required: true

volumes:
  postgres_data:
