# Shared dev, staging and production
# Values come from the shell first, then from --env-file. See docs/guides/environments.md
# ${VAR:?} stops Compose with an error when VAR is unset or empty
services:
  postgres:
    image: postgres:19-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql
    # No host port. The api reaches Postgres over the Compose network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 2s
      timeout: 5s
      retries: 15
  api:
    image: example-api:latest
    build:
      context: .
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?}

volumes:
  postgres_data:
